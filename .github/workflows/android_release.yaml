name: android_release

# on:
#   push:
#     tags:
#       - 'v*'
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)，不存在会自动创建'
        required: true
        type: string

permissions:
  contents: write

jobs:
  android-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # Gradle 8.7 不支持 Java 25（runner 镜像默认 JDK 已升级），固定使用 JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          key: gradle-cache-${{ hashFiles('starboard/android/apk/**/*gradle*') }}
          path: |
            /root/.gradle/caches
            /root/.gradle/wrapper
      - name: Set up Cloud SDK
        uses: isarkis/setup-gcloud@40dce7857b354839efac498d3632050f568090b6
      - name: Set Android env vars
        run: |
          export ANDROID_HOME="$GITHUB_WORKSPACE/Android"
          mkdir -p "$ANDROID_HOME"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          PROJECT_NAME=$(gcloud config get-value project)
      # 固定 GN 版本：2026-09-30 成功构建时 "latest" 解析到的那个版本。
      # 用 latest 的话，GN 版本会随时间变化，导致 gn check / 构建行为改变。
      - name: Install GN (pinned)
        run: |
          GN_INSTANCE_ID=aCxhMIeN1OGMPJZQLOP4Ls81xDMekRGfolf_4Ivua3EC
          GN_SHA256=682c6130878dd4e18c3c96502ce3f82ecf35c4331e91119fa257ffe08bee6b71
          wget -q "https://chrome-infra-packages.appspot.com/dl/gn/gn/linux-amd64/+/${GN_INSTANCE_ID}" -O gn.zip
          echo "${GN_SHA256}  gn.zip" | sha256sum -c -
          unzip gn.zip -d gn_bin
          sudo mv gn_bin/gn /usr/local/bin/gn
          sudo chmod +x /usr/local/bin/gn
          gn --version
      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=$GITHUB_WORKSPACE:$PYTHONPATH" >> $GITHUB_ENV
      - name: GN
        run: |
          gn gen out/android-arm64_gold --args='target_platform="android-arm64" target_os="android" target_cpu="arm64" build_type="gold" sb_api_version=15'
          gn check out/android-arm64_gold
      - name: Install build dependencies
        run: |
          sudo apt update && sudo apt install -qqy --no-install-recommends \
            bison clang libasound2-dev libgles2-mesa-dev libglib2.0-dev \
            libxcomposite-dev libxi-dev libxrender-dev nasm ninja-build \
            python3-venv ccache gcc-multilib \
            g++-multilib libc6-dev-i386
          ccache --max-size=20G
          bash ./starboard/tools/download_clang.sh
          bash ./starboard/android/shared/download_sdk.sh
      - name: Ensure Android debug keystore exists
        run: |
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            mkdir -p "$HOME/.android"
            keytool -genkey -v -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
      - name: Build Cobalt
        run: |
          NINJA_STATUS="[%e sec | %f/%t %u remaining | %c/sec | j%r] "
          ninja -C out/android-arm64_gold cobalt_install

      # 新增：重命名，避免两个架构的 cobalt.apk 在 Release 里重名
      - name: Rename APK
        run: cp out/android-arm64_gold/cobalt.apk cobalt-android-arm64.apk

      - name: Upload ARM64 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cobalt-android-arm64
          path: cobalt-android-arm64.apk
          retention-days: 7

  android-arm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # Gradle 8.7 不支持 Java 25（runner 镜像默认 JDK 已升级），固定使用 JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          key: gradle-cache-${{ hashFiles('starboard/android/apk/**/*gradle*') }}
          path: |
            /root/.gradle/caches
            /root/.gradle/wrapper
      - name: Set up Cloud SDK
        uses: isarkis/setup-gcloud@40dce7857b354839efac498d3632050f568090b6
      - name: Set Android env vars
        run: |
          export ANDROID_HOME="$GITHUB_WORKSPACE/Android"
          mkdir -p "$ANDROID_HOME"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          PROJECT_NAME=$(gcloud config get-value project)
      - name: Install GN (pinned)
        run: |
          GN_INSTANCE_ID=aCxhMIeN1OGMPJZQLOP4Ls81xDMekRGfolf_4Ivua3EC
          GN_SHA256=682c6130878dd4e18c3c96502ce3f82ecf35c4331e91119fa257ffe08bee6b71
          wget -q "https://chrome-infra-packages.appspot.com/dl/gn/gn/linux-amd64/+/${GN_INSTANCE_ID}" -O gn.zip
          echo "${GN_SHA256}  gn.zip" | sha256sum -c -
          unzip gn.zip -d gn_bin
          sudo mv gn_bin/gn /usr/local/bin/gn
          sudo chmod +x /usr/local/bin/gn
          gn --version
      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=$GITHUB_WORKSPACE:$PYTHONPATH" >> $GITHUB_ENV
      - name: GN
        run: |
          gn gen out/android-arm_gold --args='target_platform="android-arm" target_os="android" target_cpu="arm" build_type="gold" sb_api_version=15'
          gn check out/android-arm_gold
      - name: Install build dependencies
        run: |
          sudo apt update && sudo apt install -qqy --no-install-recommends \
            bison clang libasound2-dev libgles2-mesa-dev libglib2.0-dev \
            libxcomposite-dev libxi-dev libxrender-dev nasm ninja-build \
            python3-venv ccache gcc-multilib \
            g++-multilib libc6-dev-i386
          ccache --max-size=20G
          bash ./starboard/tools/download_clang.sh
          bash ./starboard/android/shared/download_sdk.sh
      - name: Ensure Android debug keystore exists
        run: |
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            mkdir -p "$HOME/.android"
            keytool -genkey -v -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
      - name: Build Cobalt
        run: |
          NINJA_STATUS="[%e sec | %f/%t %u remaining | %c/sec | j%r] "
          ninja -C out/android-arm_gold cobalt_install

      # 新增：重命名，避免两个架构的 cobalt.apk 在 Release 里重名
      - name: Rename APK
        run: cp out/android-arm_gold/cobalt.apk cobalt-android-arm.apk

      - name: Upload ARM APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cobalt-android-arm
          path: cobalt-android-arm.apk
          retention-days: 7

  # 新增：两个架构都构建成功后，统一发布到 Release
  release:
    needs: [android-arm64, android-arm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all APKs
        uses: actions/download-artifact@v4
        with:
          pattern: cobalt-android-*
          path: artifacts
          merge-multiple: true

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          # tag 不存在时，在触发 workflow 的这个提交上自动创建
          target_commitish: ${{ github.sha }}
          name: ${{ inputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: artifacts/*.apk
